<body>
<div id="header-placeholder"></div>
<main>
<form id="contact-form">
  <h3>Usprawiedliw nieobecność na służeniu</h3>
  <label for="phone">Imię Nazwisko:</label><br>
  <input name="name" placeholder="Imię Nazwisko" required><br><br>
<label for="date_field">Data:</label><br>
<input name="date" id="date_field" type="date" required><br><br>
<label for="time">Godzina:</label><br>
<select name="time" id="time" required>
  <option value="">-- wybierz --</option>
  <option value="06:00">6:00</option>
  <option value="06:30">6:30</option>
  <option value="07:00">7:00</option>
  <option value="08:00">8:00</option>
  <option value="08:30">8:30</option>
  <option value="10:00">10:00</option>
  <option value="11:30">11:30</option>
  <option value="13:00">13:00</option>
  <option value="16:00">16:00</option>
  <option value="18:00">18:00</option>
</select><br><br>
  <label for="message">Powód:</label><br>
  <textarea name="reason" placeholder="Wpisz treść..." required></textarea><br><br>
  <button type="submit">Wyślij</button>
  <p id="form-status" style="margin-top:10px;"></p>
</form>
</main>
<div id="footer-placeholder"></div>
<script src="menu.js"></script>
<script src="js/menu_wyswiwetlanie.js"></script>

<script>
fetch("menu.html")
.then(res => res.text())
.then(data => document.getElementById("menu").innerHTML = data);
</script>
<script src="js/core.js"></script>
<script src="js/menu-dropdowns.js"></script>
<script>
const initMobileMenu = setInterval(() => {
    const header = document.querySelector('header');
    if (header && !document.querySelector('.hamburger')) {
        const hamburger = document.createElement('div');
        hamburger.className = 'hamburger';
        hamburger.innerHTML = '<span></span><span></span><span></span>';
        header.appendChild(hamburger);
        hamburger.addEventListener('click', function() {
            this.classList.toggle('active');
            document.querySelector('.menu').classList.toggle('active');
            document.body.style.overflow = this.classList.contains('active') ? 'hidden' : '';
        });
        clearInterval(initMobileMenu);
    }
}, 100);
</script>
</body>
