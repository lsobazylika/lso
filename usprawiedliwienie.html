<body>

<header>
    <div class="header-left">
        <a href="index.html"><img src="images/logo.ico" alt="Logo"></a>
        <a href="index.html"><h1>Lso Gorlice</h1></a>
    </div>

    <i class="fa-solid fa-bars fa-2x burger" id="burger" style="display: none;"></i>


    <div id="menu"></div>
</header>

<main>
<form id="contact-form">
  <h3>Usprawiedliw nieobecność na służeniu</h3>
  <label for="phone">Imię Nazwisko:</label><br>
  <input name="name" placeholder="Imię Nazwisko" required><br><br>
  <label for="message">Data:</label><br>
  <input name="date" type="date" required><br><br>
  <label for="message">Godzina:</label><br>
<select name="time" id="time" required>
  <option value="">-- wybierz --</option>
  <option value="06:00">6:00</option>
  <option value="06:30">6:30</option>
  <option value="07:00">7:00</option>
  <option value="08:00">8:00</option>
  <option value="08:30">8:30</option>
  <option value="10:00">10:00</option>
  <option value="11:30">11:30</option>
  <option value="13:00">13:00</option>
  <option value="16:00">16:00</option>
  <option value="18:00">18:00</option>
</select><br><br>
  <label for="message">Powód:</label><br>
  <textarea name="reason" placeholder="Wpisz treść..." required></textarea><br><br>

  <button type="submit">Wyślij</button>

  <p id="form-status" style="margin-top:10px;"></p>
</form>
</main>

<footer>
    <article id="stopka_lewa">
        <p>&copy Dominik Kożuch</p>
    </article>
    <article id="stopka_prawa">
        <a href="https://www.facebook.com/lsobazylikagorlice"><i class="fa-brands fa-facebook fa-lg"></i></a>
        <a href="https://drive.google.com/drive/folders/1EGVS2djbNWTSWDxH6ZxScjtFW2O3RdhO?usp=sharing"><i class="fa-solid fa-cloud-arrow-up fa-lg"></i></a>
    </article>
</footer>
<script src="menu.js"></script>

<script>
fetch("menu.html")
.then(res => res.text())
.then(data => document.getElementById("menu").innerHTML = data);
</script>
<script>
document.getElementById("contact-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const status = document.getElementById("form-status");
  status.textContent = "Wysyłanie...";

  const formData = new FormData(e.target);

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbzMqywXrLySvl5xPnZW5pjYwSzfj0dphTRS8R2R3UkVWeJp1SpEshfztHEQ3hSexIqY8A/exec", {
      method: "POST",
      body: formData
    });

    const text = await res.text();

    if (text === "OK") {
      status.textContent = "✅ Wysłano!";
      status.style.color = "green";
      e.target.reset();
    } else {
      status.textContent = "❌ Błąd: " + text;
      status.style.color = "red";
    }

        setTimeout(() => {
      status.textContent = "";
    }, 4000);

  } catch (err) {
    status.textContent = "❌ Błąd wysyłania";
    status.style.color = "red";
    console.error(err);
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch("menu.html")
        .then(res => res.text())
        .then(data => {
            const container = document.getElementById("menu");
            if (!container) return;
            container.innerHTML = data;

            const burger = document.getElementById("burger");
            const menu = document.querySelector(".menu");

            if (burger && menu) {
                burger.addEventListener("click", () => {
                    menu.classList.toggle("active");
                });
            }

            // FIX: dropdown na telefonie (klik zamiast hover)
            document.querySelectorAll(".dropdown > a").forEach(el => {
                el.addEventListener("click", (e) => {
                    if (window.innerWidth <= 1000) {
                        e.preventDefault();
                        const parent = el.parentElement;
                        parent.classList.toggle("open");
                    }
                });
            });
        });
});
</script>
</body>
</html>
